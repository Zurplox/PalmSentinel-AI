name: PalmSentinel AI CI Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    name: Agri-Vision Engine & Math Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run 47-Point Comprehensive System Audit Suite
        run: |
          python audit_suite.py

      - name: Verify Core Modules Import
        run: |
          python -c "import engine.detector, engine.roi_utils, engine.tiler, app; print('All core modules loaded and verified successfully!')"
